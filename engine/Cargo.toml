[package]
publish = false
name = "zimfile-xapian"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "libzim's Xapian search indexes (read, write, search) in pure Rust: a reimplementation, not bindings"
readme = "README.md"
keywords = ["zim", "kiwix", "xapian", "search", "offline"]
categories = ["parser-implementations", "text-processing"]
include = ["/src/**", "/tests/**", "/data/stopwords/**", "/LICENSES/**", "/README.md", "/LICENSE"]

[dependencies]
flate2 = "1.1.11"
icu_normalizer = "2.4.0"
icu_properties = "2.4.0"
rust-stemmers = "1.2.0"

[dev-dependencies]
zimru = { path = "../../zimru", default-features = false }
tempfile = "3"
