[package]
name = "zimru"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Independent Rust re-implementation of the ZIM file format reader (clean-room, MIT-licensed)."
repository = "https://github.com/jasontitus/zimru"
readme = "README.md"
keywords = ["zim", "openzim", "wikipedia", "kiwix"]
categories = ["filesystem", "compression", "parser-implementations"]
# We declare every binary explicitly with `[[bin]]` below. Disable
# auto-discovery so `src/bin/_*.rs` files (which are per-bin shared
# helper modules included via `#[path = ...]`) aren't treated as
# standalone binaries.
autobins = false

[features]
default = ["writer"]
# Enable the ZIM file writer (`zimru::writer::Creator`) and the
# `zimrecreate` / `zimwriterfs` binaries. With default features disabled
# the crate is reader-only. flate2 backs `zimwriterfs -x/--inflateHtml`.
writer = ["dep:flate2", "dep:lzma-rust2"]
# Compile the `extern "C"` API surface (`zimru::cffi`) and emit the
# generated `include/zimru.h` from build.rs. Required when consuming
# zimru as a `cdylib` / `staticlib` from C, C++, or other FFI callers.
# Implies the `writer` feature so the C ABI exposes the Creator too.
cffi = ["writer", "dep:cbindgen"]
# Compatibility for callers that already hold a mapping and enforce its safety contract.
legacy-mmap = ["dep:memmap2"]

[lib]
name = "zimru"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

# Each [[bin]] sets `test = false` so `cargo test` doesn't compile a
# zero-test harness for it — integration tests live under `tests/` and shell
# out to the Cargo-built binaries (`env!("CARGO_BIN_EXE_*")`).

[[bin]]
name = "zimru"
path = "src/bin/zimru.rs"
test = false

[[bin]]
name = "zimcheck"
path = "src/bin/zimcheck.rs"
test = false

[[bin]]
name = "zimdump"
path = "src/bin/zimdump.rs"
test = false

[[bin]]
name = "zimbench"
path = "src/bin/zimbench.rs"
test = false

[[bin]]
name = "zimsplit"
path = "src/bin/zimsplit.rs"
test = false

[[bin]]
name = "zimrecreate"
path = "src/bin/zimrecreate.rs"
required-features = ["writer"]
test = false

[[bin]]
name = "zimwriterfs"
path = "src/bin/zimwriterfs.rs"
required-features = ["writer"]
test = false

[dependencies]
memmap2 = { version = "0.9", optional = true }
zstd = { version = "0.13", default-features = false, features = ["zstdmt"] }
xz2 = "0.1"
lzma-rust2 = { version = "=0.25.0", optional = true, default-features = false, features = ["std", "xz", "encoder"] }
md5 = "0.8.1"
rayon = "1"
thiserror = "2"
lru = "0.19"
# Poison-free locks for the writer byte budget and zimdump's shared state.
parking_lot = "0.12"
# Pure-Rust gzip (miniz_oxide backend) for `zimwriterfs --inflateHtml`.
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }

[target.'cfg(unix)'.dependencies]
# libc supplies the CLI signal constants. rustix handles fd-relative
# extraction and platform-specific I/O hints.
libc = "0.2"
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
hex = "0.4"
zstd = { version = "0.13", default-features = false, features = ["zstdmt"] }
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }

[[example]]
name = "gen_raw_zim"
required-features = ["writer"]

[[example]]
name = "gen_shuffled_zim"
required-features = ["writer"]

[[example]]
name = "writer_bench"
required-features = ["writer"]

[[bench]]
name = "get_entry_by_path"
harness = false
required-features = []

[[bench]]
name = "cluster_decode"
harness = false
required-features = []

[[bench]]
name = "warmup"
harness = false
required-features = []

[build-dependencies]
# Header generation runs on the build host only for the optional C ABI.
cbindgen = { version = "0.27", default-features = false, optional = true }

[package.metadata.docs.rs]
features = ["writer", "cffi"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Cargo's default `strip = "debuginfo"` runs Apple `strip` on the cdylib,
# which leaves the LINKEDIT string pool 4-byte aligned; Xcode 16+ `ld`
# refuses to link against it ("mis-aligned LINKEDIT string pool"). macOS
# debuginfo is unpacked into .o files regardless, so nothing is lost.
strip = "none"
