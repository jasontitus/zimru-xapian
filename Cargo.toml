[package]
publish = false
name = "zimru-xapian"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Standalone Glass index search and indexing tools for ZIM archives"
default-run = "zimsearch"

[workspace]
members = ["engine"]
resolver = "3"

[dependencies]
zimfile-xapian = { path = "engine" }
zimru = { git = "https://github.com/jasontitus/zimru", rev = "061afbc2920c78fc4ecb7211cb9ef4f3655dba35", default-features = false }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
memmap2 = "0.9"
xz2 = "0.1"
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
zimru = { git = "https://github.com/jasontitus/zimru", rev = "061afbc2920c78fc4ecb7211cb9ef4f3655dba35", features = ["writer"] }
