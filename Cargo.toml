[package]
publish = false
name = "zimru-xapian"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Standalone Glass index search and indexing tools for ZIM archives"
default-run = "zimsearch"

[workspace]
members = ["engine"]
resolver = "3"

[dependencies]
zimfile-xapian = { path = "engine" }
zimru = { path = "../zimru", default-features = false }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
zimru = { path = "../zimru", features = ["writer"] }
